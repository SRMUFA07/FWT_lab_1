<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger BOB — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* ===== Сброс настроек страницы  ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== Фон ===== */
        body {
            font-family: 'Jost', 'National Park', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url('images/login-bg.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Тёмный полупрозрачный оверлей для читаемости */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(60, 20, 0, 0.55);
            z-index: 0;
        }



        /* ===== Форма ===== */
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 2.8rem 2.5rem 2.2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,177,67,0.3);
        }

        /* Логотип / заголовок */
        .login-logo {
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .login-logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.2rem;
        }

        .login-logo h1 {
            font-size: 1.9rem;
            color: #8b4800;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .login-logo p {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 0.3rem;
            margin-bottom: 1.8rem;
        }

        /* Разделитель */
        .divider {
            border: none;
            border-top: 1.5px solid #f0e0cc;
            margin-bottom: 1.8rem;
        }

        /* Поля формы */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #5a3000;
            margin-bottom: 0.4rem;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            color: #333;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #ffb143;
            box-shadow: 0 0 0 3px rgba(255, 177, 67, 0.25);
            background: #fff;
        }

        /* Чекбокс */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0 1.5rem;
        }

        .remember-row input[type="checkbox"] {
            accent-color: #ffb143;
            width: 17px;
            height: 17px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .remember-row label {
            font-size: 0.95rem;
            color: #555;
            cursor: pointer;
            user-select: none;
        }

        /* Кнопка отправки */
        .btn-login {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #ffb143 0%, #ff8f00 100%);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255,140,0,0.4);
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .btn-login:hover {
            opacity: 0.92;
            box-shadow: 0 6px 20px rgba(255,140,0,0.5);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        /* Ссылка назад */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.3rem;
            font-size: 0.88rem;
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffb143;
        }
    </style>
</head>
<body>

    <!-- Карточка с формой -->
    <div class="login-card">
        <div class="login-logo">
            <span class="login-logo-icon">🍔</span>
            <h1>Burger BOB</h1>
            <p>Войдите в личный кабинет</p>
        </div>

        <hr class="divider">

        <form action="https://httpbin.org/post" method="POST">

            <!-- Логин -->
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="Введите логин" required autofocus>
            </div>

            <!-- Пароль -->
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <!-- Запомнить меня -->
            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember" value="yes">
                <label for="remember">Запомнить меня</label>
            </div>

            <button type="submit" class="btn-login">Войти</button>
        </form>

        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>
</body>
</html>
